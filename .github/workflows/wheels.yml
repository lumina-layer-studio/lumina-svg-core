name: Build wheels

on:
  pull_request:
    branches: ["dev-refactor"]
  push:
    branches: ["dev-refactor"]
  workflow_dispatch:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
            build: cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64
          - id: windows-amd64
            runner: windows-2022
            build: cp312-win_amd64 cp313-win_amd64 cp314-win_amd64
          - id: macos-arm64
            runner: macos-15
            build: cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64
          - id: macos-x86_64
            runner: macos-15-intel
            build: cp312-macosx_x86_64 cp313-macosx_x86_64 cp314-macosx_x86_64
    env:
      CIBW_BUILD: ${{ matrix.build }}
      CIBW_ARCHS: auto64
      LUMINA_SVG_BUILD_REVISION: ${{ github.sha }}
      LUMINA_SVG_BUILD_DIRTY: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Prepare checked wheels and source/hash receipt
        run: |
          python tools/package_distribution.py --wheel-dir wheelhouse --output-dir "${{ runner.temp }}/prepared-wheels" --require-clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-svg-core-${{ matrix.id }}
          path: ${{ runner.temp }}/prepared-wheels/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 30 }}
          compression-level: 0

  source:
    name: Source distribution and native regression
    runs-on: ubuntu-24.04
    env:
      LUMINA_SVG_BUILD_REVISION: ${{ github.sha }}
      LUMINA_SVG_BUILD_DIRTY: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and exercise the source distribution
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir wheelhouse
          python tools/verify_wheel.py wheelhouse/*.whl --contents-only
          python -m pip install wheelhouse/*.whl pytest "shapely>=2,<3" "cmake==4.3.4" "pybind11==3.1.0"
          python tools/verify_wheel.py --installed
          python -m pytest tests -q
      - name: Run the native canonical-boundary regression
        run: |
          cmake -S . -B build/canonical -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DBUILD_TESTING=ON
          cmake --build build/canonical --target lumina_svg_canonical_predicates_regression --parallel 2
          ctest --test-dir build/canonical --output-on-failure
      - name: Prepare the checked source distribution and receipt
        run: |
          python tools/package_distribution.py --sdist-dir dist --output-dir "${{ runner.temp }}/prepared-source" --require-clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-svg-core-sdist
          path: ${{ runner.temp }}/prepared-source/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 30 }}
