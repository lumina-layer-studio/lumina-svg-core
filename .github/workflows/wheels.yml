name: Build wheels

on:
  pull_request:
    branches: ["dev-refactor"]
  push:
    branches: ["dev-refactor"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: windows-amd64
            runner: windows-2022
            build: cp312-win_amd64
          - id: macos-arm64
            runner: macos-15
            build: cp312-macosx_arm64
          - id: macos-x86_64
            runner: macos-15-intel
            build: cp312-macosx_x86_64
    env:
      CIBW_BUILD: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and exercise the Linux source distribution and wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir wheelhouse
          python tools/verify_wheel.py wheelhouse/*.whl --contents-only
          python -m pip install wheelhouse/*.whl pytest "shapely>=2,<3"
          python tools/verify_wheel.py --installed
          python -m pytest tests -q
      - name: Run the native canonical-boundary regression
        if: runner.os == 'Linux'
        run: |
          python -m pip install "cmake==4.3.4" "pybind11==3.1.0"
          cmake -S . -B build/canonical -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DBUILD_TESTING=ON
          cmake --build build/canonical --target lumina_svg_canonical_predicates_regression --parallel 2
          ctest --test-dir build/canonical --output-on-failure
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        if: runner.os != 'Linux'
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-svg-core-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: lumina-svg-core-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
